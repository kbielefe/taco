services:
  mongodb:
    image: docker.io/library/mongo:8
    container_name: health-tracker-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: health
      MONGO_CACHE_USERNAME: ${MONGO_CACHE_USERNAME:?MONGO_CACHE_USERNAME is required}
      MONGO_CACHE_PASSWORD: ${MONGO_CACHE_PASSWORD:?MONGO_CACHE_PASSWORD is required}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_ROOT_USERNAME}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: docker.io/library/mongo-express:1
    container_name: health-tracker-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build: .
    container_name: health-tracker-web
    restart: unless-stopped
    init: true
    ports:
      - "3001:3001"
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      MONGODB_URI: mongodb://${MONGO_CACHE_USERNAME}:${MONGO_CACHE_PASSWORD}@mongodb:27017/health?authSource=health
      USDA_API_KEY: ${USDA_API_KEY:?USDA_API_KEY is required}
      XAI_API_KEY: ${XAI_API_KEY:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      BIRTH_YEAR: ${BIRTH_YEAR:-}
      SEX: ${SEX:-}
      HEIGHT_IN: ${HEIGHT_IN:-}
      HEIGHT_CM: ${HEIGHT_CM:-}
      ACTIVITY: ${ACTIVITY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    container_name: health-tracker-mlflow
    restart: unless-stopped
    # Proxied artifacts so the web container uploads traces over HTTP.
    # allowed-hosts includes the compose DNS name mlflow; the default list does not.
    command:
      [
        "sh",
        "-c",
        "mkdir -p /mlflow/artifacts && exec mlflow server --host 0.0.0.0 --port 5000 --workers 1 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --allowed-hosts localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*,10.*,192.168.*,172.16.*,172.17.*,172.18.*,172.19.*,172.20.*,172.21.*,172.22.*,172.23.*,172.24.*,172.25.*,172.26.*,172.27.*,172.28.*,172.29.*,172.30.*,172.31.*",
      ]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: health-tracker-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      web:
        condition: service_healthy

volumes:
  mongodb_data:
  mlflow_data:
